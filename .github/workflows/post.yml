name: LinkedIn Auto-Post - Kol Kav

on:
  schedule:
    # ב/ד/ו בשעה 07:00 UTC = 10:00 ישראל
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force post regardless of day'
        required: false
        default: 'false'

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run poster
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python3 linkedin_poster.py --force
          else
            python3 linkedin_poster.py
          fi
        env:
          PYTHONUNBUFFERED: "1"
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Commit updated session
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add storage_state.json queue.json log.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Update LinkedIn session + log [skip ci]"
          git push
